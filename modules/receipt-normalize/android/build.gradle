plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.silo'
version = '0.1.0'

android {
  namespace "expo.modules.receiptnormalize"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "androidx.exifinterface:exifinterface:1.3.7"
  // FileProvider for handing the downloaded update APK to the package installer.
  implementation "androidx.core:core:1.13.1"
}

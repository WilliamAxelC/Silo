plugins { id 'com.android.application' }
android {
    namespace 'dev.silo.bench'
    compileSdk 36
    defaultConfig { applicationId 'dev.silo.bench'; minSdk 24; targetSdk 36; versionCode 1; versionName '1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    // Same artifact and version that @react-native-ml-kit/text-recognition pulls into Silo (Latin script).
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
